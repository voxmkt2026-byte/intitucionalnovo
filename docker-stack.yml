services:
  site:
    image: ${APP_IMAGE:-titanium-consultoria:22ae8ab}
    environment:
      APP_REVISION: ${APP_REVISION:-22ae8abfbe5c800bc118c3b1017342ee3a0f3198}
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: https://${APP_DOMAIN}
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
      PORT: "3000"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    secrets:
      - ADMIN_SECRET
      - DATABASE_URL
      - GOOGLE_ADS_CLIENT_ID
      - GOOGLE_ADS_CLIENT_SECRET
      - GOOGLE_ADS_CUSTOMER_ID
      - GOOGLE_ADS_DEVELOPER_TOKEN
      - GOOGLE_ADS_REFRESH_TOKEN
      - JWT_SECRET
      - KOMMO_ACCESS_TOKEN
      - META_ACCESS_TOKEN
      - META_ACCESS_TOKEN_2
      - META_CAPI_ACCESS_TOKEN
      - META_CAPI_ACCESS_TOKEN_2
      - META_INSIGHTS_TOKEN_2
      - META_MARKETING_ACCESS_TOKEN
      - META_MARKETING_ACCESS_TOKEN_2
      - META_PIXEL_ID
      - META_PIXEL_ID_2
      - N8N_KOMMO_WEBHOOK_URL
      - SHEETS_WEBHOOK_URL
    networks:
      - traefik
    stop_grace_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 45s
      rollback_config:
        parallelism: 1
        order: stop-first
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.docker.network=${TRAEFIK_NETWORK}
        - traefik.http.routers.titanium-site.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
        - traefik.http.routers.titanium-site.rule=Host(`${APP_DOMAIN}`) || Host(`www.${APP_DOMAIN}`)
        - traefik.http.routers.titanium-site.tls=true
        - traefik.http.routers.titanium-site.tls.certresolver=${TRAEFIK_CERTRESOLVER}
        - traefik.http.services.titanium-site.loadbalancer.server.port=3000

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}

secrets:
  ADMIN_SECRET:
    external: true
    name: titanium_ADMIN_SECRET
  DATABASE_URL:
    external: true
    name: titanium_DATABASE_URL
  GOOGLE_ADS_CLIENT_ID:
    external: true
    name: titanium_GOOGLE_ADS_CLIENT_ID
  GOOGLE_ADS_CLIENT_SECRET:
    external: true
    name: titanium_GOOGLE_ADS_CLIENT_SECRET
  GOOGLE_ADS_CUSTOMER_ID:
    external: true
    name: titanium_GOOGLE_ADS_CUSTOMER_ID
  GOOGLE_ADS_DEVELOPER_TOKEN:
    external: true
    name: titanium_GOOGLE_ADS_DEVELOPER_TOKEN
  GOOGLE_ADS_REFRESH_TOKEN:
    external: true
    name: titanium_GOOGLE_ADS_REFRESH_TOKEN
  JWT_SECRET:
    external: true
    name: titanium_JWT_SECRET
  KOMMO_ACCESS_TOKEN:
    external: true
    name: titanium_KOMMO_ACCESS_TOKEN
  META_ACCESS_TOKEN:
    external: true
    name: titanium_META_ACCESS_TOKEN
  META_ACCESS_TOKEN_2:
    external: true
    name: titanium_META_ACCESS_TOKEN_2
  META_CAPI_ACCESS_TOKEN:
    external: true
    name: titanium_META_CAPI_ACCESS_TOKEN
  META_CAPI_ACCESS_TOKEN_2:
    external: true
    name: titanium_META_CAPI_ACCESS_TOKEN_2
  META_INSIGHTS_TOKEN_2:
    external: true
    name: titanium_META_INSIGHTS_TOKEN_2
  META_MARKETING_ACCESS_TOKEN:
    external: true
    name: titanium_META_MARKETING_ACCESS_TOKEN
  META_MARKETING_ACCESS_TOKEN_2:
    external: true
    name: titanium_META_MARKETING_ACCESS_TOKEN_2
  META_PIXEL_ID:
    external: true
    name: titanium_META_PIXEL_ID
  META_PIXEL_ID_2:
    external: true
    name: titanium_META_PIXEL_ID_2
  N8N_KOMMO_WEBHOOK_URL:
    external: true
    name: titanium_N8N_KOMMO_WEBHOOK_URL
  SHEETS_WEBHOOK_URL:
    external: true
    name: titanium_SHEETS_WEBHOOK_URL
